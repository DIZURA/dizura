name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Secret scan
        run: node scripts/scan-secrets.mjs
      - run: npm ci --ignore-scripts
      - name: Typecheck & lint
        run: npm run check
      - name: Build
        run: npm run build
        env:
          APP_SECRET: ci-only-placeholder-secret-not-used-anywhere-0000
